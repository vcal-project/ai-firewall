listen_addr 0.0.0.0:8080;
redis_url redis://redis:6379;

upstream_provider openai_compatible;
upstream_base_url http://host.docker.internal:1234/v1;
upstream_api_key dummy;

# Enable semantic cache only if LM Studio is serving an OpenAI-compatible embedding model.
embedding_provider openai_compatible;
embedding_base_url http://host.docker.internal:1234/v1;
embedding_api_key dummy;
embedding_model text-embedding-model;

qdrant_url http://qdrant:6334;
qdrant_collection aif_semantic_cache;
qdrant_vector_size 768;

semantic_cache_enabled false;
semantic_cache_fail_open true;
semantic_similarity_threshold 0.92;

cache_ttl_seconds 86400;
request_timeout_seconds 120;

allow_unknown_models_pass_through true;