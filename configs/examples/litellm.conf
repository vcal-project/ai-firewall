listen_addr 0.0.0.0:8080;
redis_url redis://redis:6379;

upstream_provider openai_compatible;
upstream_base_url http://litellm:4000/v1;
upstream_api_key your-litellm-key-or-dummy;

embedding_provider openai_compatible;
embedding_base_url http://litellm:4000/v1;
embedding_api_key your-litellm-key-or-dummy;
embedding_model text-embedding-3-small;

qdrant_url http://qdrant:6334;
qdrant_collection aif_semantic_cache;
qdrant_vector_size 1536;

semantic_cache_enabled true;
semantic_cache_fail_open true;
semantic_similarity_threshold 0.92;

cache_ttl_seconds 86400;
request_timeout_seconds 120;

allow_unknown_models_pass_through true;