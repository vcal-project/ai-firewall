name: AI Cost Firewall CI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Require committed dependency lock
        run: test -f Cargo.lock
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo test --locked --all-targets --all-features
      - name: Audit dependencies
        run: |
          cargo install cargo-audit --locked
          cargo audit
      - run: cargo build --locked --release
      - name: Lifecycle failure tests
        run: AIF_BIN=target/release/ai-firewall ./tests/failure/run-lifecycle-failures.sh

  image:
    runs-on: ubuntu-latest
    needs: rust
    steps:
      - uses: actions/checkout@v4
      - name: Require committed dependency lock
        run: test -f Cargo.lock
      - name: Build hardened image
        run: |
          docker build \
            --build-arg AIF_VERSION="$(awk -F'"' '/^version = / {print $2; exit}' Cargo.toml)" \
            --build-arg VCS_REF="$GITHUB_SHA" \
            --build-arg BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -t ai-firewall:ci .
      - name: Generate CycloneDX SBOM
        run: |
          docker run --rm -v "$PWD:/work" -w /work rust:1.96.0-bookworm sh -c '
            cargo install cargo-cyclonedx --locked &&
            cargo cyclonedx --format json
          '
      - uses: actions/upload-artifact@v4
        with:
          name: ai-firewall-sbom
          path: "**/*.cdx.json"
          if-no-files-found: error
