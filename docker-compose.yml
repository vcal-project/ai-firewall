services:
  redis:
    image: redis:8
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  qdrant:
    image: qdrant/qdrant:v1.18.2
    volumes:
      - qdrant_storage:/qdrant/storage
    restart: unless-stopped

  firewall:
    build:
      context: .
      dockerfile: Dockerfile
    image: vcalproject/ai-firewall:v0.4.1
    depends_on:
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
    ports:
      - "8080:8080"
    volumes:
      - ./configs:/configs:ro
    command: ["--config", "/configs/ai-firewall.conf"]
    environment:
      RUST_LOG: "info,vcal_evidence=info"
      # These environment variables are used only when no config file is supplied.
      # AIF_AUDIT_ENABLED: "true"
      # AIF_AUDIT_URL: "http://vcal-audit:8092"
      # AIF_AUDIT_API_KEY: "replace-with-shared-audit-token"
      # AIF_AUDIT_PRODUCER_INSTANCE_ID: "ai-firewall-01"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.10.0
    depends_on:
      - firewall
    ports:
      - "9090:9090"
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.4.2
    depends_on:
      - prometheus
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./deploy/grafana/dashboards:/etc/grafana/provisioning/dashboards-json:ro
      - ./deploy/grafana/provisioning/dashboards/dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml:ro
      - ./deploy/grafana/provisioning/datasources/datasource.yml:/etc/grafana/provisioning/datasources/datasource.yml:ro
    restart: unless-stopped

volumes:
  redis_data:
  qdrant_storage:
  grafana_data: