global:
  scrape_interval: 5s

scrape_configs:
  - job_name: "ai-firewall"
    static_configs:
      - targets: ["firewall:8080"]

  - job_name: "vcal-privacy-guard"
    static_configs:
      - targets: ["vcal-privacy-guard:8090"]

  - job_name: "vcal-security-guard"
    static_configs:
      - targets: ["vcal-security-guard:8091"]
  
  - job_name: "vcal-audit"
    static_configs:
      - targets: ["vcal-audit:8092"]

  - job_name: "vcal-compliance"
    static_configs:
      - targets: ["vcal-compliance:8093"]