listen_addr 0.0.0.0:8080;
redis_url redis://redis:6379;

upstream_provider openai_compatible;
upstream_base_url https://api.openai.com;
upstream_api_key sk-your-openai-key;

# Controlled streaming is optional per request. When stream=true, AI Cost
# Firewall consumes and assembles the complete upstream SSE response, applies
# response controls, then replays an approved OpenAI-compatible SSE response.
# Provider SSE support is required only for requests that use stream=true.
streaming_enabled true;
# Maximum cumulative provider SSE bytes accepted for one controlled streaming request.
max_stream_upstream_bytes 8M;

embedding_provider openai_compatible;
embedding_base_url http://ollama:11434/v1;
embedding_api_key dummy;
embedding_model nomic-embed-text;

qdrant_url http://qdrant:6334;
qdrant_collection aif_semantic_cache;
qdrant_vector_size 768;

semantic_cache_enabled true;
semantic_cache_fail_open true;
# With semantic_cache_fail_open=true, request processing can continue when the
# embedding provider or Qdrant is unavailable. Configure readiness requirements
# separately if semantic cache availability must be mandatory.
semantic_similarity_threshold 0.92;

exact_cache_ttl_seconds 86400;
semantic_cache_retention_seconds 604800;
request_timeout_seconds 120;
# Also used as the maximum idle gap between provider SSE chunks.
upstream_timeout_seconds 120;
# Controlled provider generation has an independent 15-minute absolute ceiling.

# Only models defined through model_price are accepted by default.
# Add model_price entries for additional models, or set this to true for
# local/custom OpenAI-compatible model names.
allow_unknown_models_pass_through false;
model_price gpt-4o-mini-2024-07-18 0.15 0.60;

# VCAL evidence events
#
# AI Firewall emits structured vcal.evidence.event schema v1.1 events through
# application logs. Each request trace that emits request.received ends with
# exactly one request.completed or request.failed event.
# Enable evidence events with: RUST_LOG=info,vcal_evidence=info
