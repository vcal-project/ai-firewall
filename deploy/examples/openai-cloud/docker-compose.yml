services:
  redis:
    image: redis:8
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  qdrant:
    image: qdrant/qdrant:v1.18.2
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/collections"]
      interval: 10s
      timeout: 5s
      retries: 10

  firewall:
    image: ${AIF_IMAGE:-vcalproject/ai-firewall:v0.4.0}
    depends_on:
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
    ports:
      - "8080:8080"
    volumes:
      - ./ai-firewall.conf:/configs/ai-firewall.conf:ro
    command: ["--config", "/configs/ai-firewall.conf"]
    environment:
      RUST_LOG: "info,vcal_evidence=info"
    restart: unless-stopped

volumes:
  redis_data:
  qdrant_storage:
