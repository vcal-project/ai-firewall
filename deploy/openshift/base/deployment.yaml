apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-firewall
  labels:
    app.kubernetes.io/name: ai-firewall
    app.kubernetes.io/part-of: vcal
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ai-firewall
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ai-firewall
        app.kubernetes.io/part-of: vcal
    spec:
      # AIF does not use the Kubernetes API.
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 45
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ai-firewall
          image: vcalproject/ai-firewall:v0.8.2
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: ai-firewall-config
          env:
            # Create ai-firewall-secrets before applying this Deployment.
            - name: AIF_REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: ai-firewall-secrets
                  key: redis-url
            - name: AIF_UPSTREAM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: ai-firewall-secrets
                  key: upstream-api-key
            - name: AIF_EMBEDDING_API_KEY
              valueFrom:
                secretKeyRef:
                  name: ai-firewall-secrets
                  key: embedding-api-key
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
            # Do not set runAsUser/runAsGroup. OpenShift restricted-v2 assigns
            # a namespace-specific arbitrary UID/GID range.
          startupProbe:
            httpGet:
              path: /startupz
              port: http
              scheme: HTTP
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 12
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
              scheme: HTTP
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
              scheme: HTTP
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
