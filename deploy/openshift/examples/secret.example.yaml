apiVersion: v1
kind: Secret
metadata:
  name: ai-firewall-secrets
type: Opaque
stringData:
  # Replace before use. For a local upstream with no bearer authentication,
  # AIF accepts the placeholder value "none" and will not send Authorization.
  upstream-api-key: "none"
  # Keep this separate even when both vLLM services currently use no auth;
  # production clusters may protect inference and embedding services differently.
  embedding-api-key: "none"
  redis-url: "redis://redis:6379"
